quarkus.http.port=8080

# --- Device connections ---
# Server pings every connected device; the pong (or any frame) refreshes its last-seen time.
quarkus.websockets-next.server.auto-ping-interval=30s
# A connection silent for this long (= 3 missed pings) is closed and the device marked offline.
devices.liveness-timeout=90s
devices.liveness-check-interval=10s

# --- Database ---
# dev/test: Quarkus Dev Services starts a throwaway Postgres container automatically (needs Docker).
# prod: connection comes from env vars, defaults match docker-compose.yml in the repo root.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/devices}
%prod.quarkus.datasource.username=${DB_USER:devices}
%prod.quarkus.datasource.password=${DB_PASSWORD:devices}

# Schema is generated from the entities. Fine for a demo; production would use Flyway migrations.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
